  <body>
    <!-- HERO SECTION -->
    <div
      id="hero"
      style="background-image: url('./assets/imgs/hero_all_news.jpg')"
      class="w-full bg-center bg-cover grid *:[grid-area:1/1]"
    >
      <div class="bg-linear-to-b from from-transparent to-black/35"></div>
      <section class="w-full backdrop-blur-md">
        <div class="w-full space-y-6 @4xl:space-y-14">
          <div class="pt-5 flex justify-center items-center">
            <a href="./" class="w-14 lg:w-28">
              <img src="./moeys_logo.svg" alt="MoEYS Logo" />
            </a>
          </div>

          <div class="news-hero-info space-y-4 pb-8 @2xl:pb-12 @4xl:pb-16">
            <h1
              class="text-balance text-title @2xl:py-6 @4xl:py-12 text-background!"
            >
              សកម្មភាព និងបច្ចុប្បន្នភាព
            </h1>
          </div>
        </div>
      </section>
    </div>
    <!-- END -->

    <section id="all-news">
      <div x-data class="space-y-6 py-12">
        <template
          x-for="item in ['news-1', 'news-2', 'news-3','sample-news-card','news-1', 'news-2']"
        >
          <a
            href="each-news.html"
            aria-describedby="news-content"
            class="news-card"
          >
            <!-- news image -->
            <div class="news-card-image @2xl:w-56 @4xl:w-64">
              <img :src="`/src/assets/imgs/${item}.jpg`" alt="News card" />
            </div>
            <!-- news info -->
            <div class="news-card-info">
              <!-- date -->
              <div class="news-card-info-date">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="32"
                  height="32"
                  viewBox="0 0 24 24"
                >
                  <g
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                  >
                    <path
                      d="M16 14v2.2l1.6 1M16 2v4m5 1.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5M3 10h5m0-8v4"
                    />
                    <circle cx="16" cy="16" r="6" />
                  </g>
                </svg>
                <h4 class="text-sm">26-កុម្ភៈ-2024</h4>
              </div>
              <!-- news content -->
              <h5>
                រាជធានីភ្នំពេញ៖ នារសៀលថ្ងៃទី២៦ ខែកុម្ភៈ ២០២៤
                ឯកឧត្តមបណ្ឌិតសភាចារ្យ ហង់ជួន ណារ៉ុន ឧបនាយករដ្ឋមន្ត្រី
                រដ្ឋមន្រ្តីក្រសួងអប់រំ យុវជន និងកីឡា
              </h5>
              <p id="news-content">
                រាជធានីភ្នំពេញ៖ នារសៀលថ្ងៃទី២៦ ខែកុម្ភៈ ២០២៤
                ឯកឧត្តមបណ្ឌិតសភាចារ្យ ហង់ជួន ណារ៉ុន ឧបនាយករដ្ឋមន្ត្រី
                រដ្ឋមន្រ្តីក្រសួងអប់រំ យុវជន និងកីឡា
              </p>
            </div>
          </a>
        </template>
      </div>
    </section>

    <!-- FOOTER -->

        <h5 class="font-semibold text-sm text-center @4xl:text-left">
          &copy;

    <!-- increase & decrease font size -->
    <script>
      document.addEventListener("alpine:init", () => {
        Alpine.data("fontSize", () => ({
          fontSize: 16,
          maxSize: 32,
          minSize: 12,
          step: 2,
          increment() {
            if (this.fontSize <= this.maxSize) {
              this.fontSize += this.step;
            }
          },
          decrement() {
            if (this.fontSize >= this.minSize) {
              this.fontSize -= this.step;
            }
          },
        }));
      });
    </script>
